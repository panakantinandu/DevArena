<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4efe3" />
    <meta name="description" content="DevArena: code, compete, interview, improve. Interview prep with friends." />
    <title>DevArena</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the wrong theme.
      (function () {
        try {
          var m = localStorage.getItem('devarena-theme') || 'system'
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
