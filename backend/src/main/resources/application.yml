spring:
  application:
    name: devarena
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devarena}
    username: ${DATABASE_USERNAME:devarena}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Sized for free-tier hosts with ~512 MB RAM and small connection limits.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 14d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */30 * * * *"
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: ${DEVARENA_SECURE_COOKIES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

devarena:
  cors-allowed-origins: ${DEVARENA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  secure-cookies: ${DEVARENA_SECURE_COOKIES:false}
  login-max-attempts: 5
  login-lock-minutes: 15
  ws-ticket-seconds: 30
  seed-demo-users: ${DEVARENA_SEED_DEMO_USERS:false}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
